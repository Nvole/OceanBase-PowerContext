app:
  description: "一场不用大模型也能打完的脑洞辩论。输入辩词后，先检索旧档案，再由杠精主持人抬杠，最后把这一轮写回 seekdb。"
  icon: "🎭"
  icon_background: "#FFEAD5"
  mode: workflow
  name: "离谱辩题"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.5.0"
workflow:
  conversation_variables: []
  environment_variables:
    - id: "b7c1a2e0-4d55-41d0-9a11-04d1f4e00001"
      name: DEBATE_API_BASE
      value: "http://127.0.0.1:18604"
      value_type: string
      description: "辩论 HTTP 服务。只在能访问该回环地址的机器上使用。"
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: http-request
        id: "1733000101-source-1733000102-target"
        source: "1733000101"
        sourceHandle: source
        target: "1733000102"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: "1733000102-source-1733000103-target"
        source: "1733000102"
        sourceHandle: source
        target: "1733000103"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: "1733000103-source-1733000104-target"
        source: "1733000103"
        sourceHandle: source
        target: "1733000104"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: end
        id: "1733000104-source-1733000105-target"
        source: "1733000104"
        sourceHandle: source
        target: "1733000105"
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: "玩家输入辩手、辩题、立场和辩词。"
          selected: false
          title: 输入
          type: start
          variables:
            - label: 辩手
              max_length: 24
              options: []
              required: true
              type: text-input
              variable: player
            - label: 辩题
              max_length: 40
              options: []
              required: true
              type: text-input
              variable: motion
            - label: 立场
              max_length: 8
              options:
                - 正方
                - 反方
              required: true
              type: select
              variable: side
            - label: 辩词
              max_length: 240
              options: []
              required: true
              type: paragraph
              variable: argument
        height: 170
        id: "1733000101"
        position:
          x: 80
          y: 220
        positionAbsolute:
          x: 80
          y: 220
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - key: ""
                type: text
                value: '{"text": "{{#1733000101.argument#}}", "motion": "{{#1733000101.motion#}}", "n_results": 3}'
            type: json
          desc: "调用本机服务，让 seekdb hybrid_search 检索旧辩词。"
          headers: "Content-Type: application/json"
          method: post
          params: ""
          selected: false
          ssl_verify: true
          timeout:
            connect: 10
            read: 30
            write: 30
          title: HTTP 检索
          type: http-request
          url: "{{#env.DEBATE_API_BASE#}}/v1/retrieve"
        height: 140
        id: "1733000102"
        position:
          x: 380
          y: 220
        positionAbsolute:
          x: 380
          y: 220
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            def main(player: str, motion: str, side: str, argument: str, retrieve_body: str) -> dict:
                import json
                if isinstance(retrieve_body, dict):
                    payload = retrieve_body
                else:
                    payload = json.loads(retrieve_body or "{}")
                hits = payload.get("hits") or []
                opposite = {"正方": "反方", "反方": "正方"}
                pivots = (
                    ("猫", "猫如果交税，税务局得先学会听懂呼噜，否则征到的只是毛。"),
                    ("税", "税单一出，连路过的影子都会要求退税。"),
                    ("冰箱", "冰箱投出的票一定是冷藏票，热食提案永远过不了。"),
                    ("周一", "取消周一之后，周二会连夜改名，麻烦只是换了工牌。"),
                    ("梦想", "梦想按斤卖会缺斤短两，因为灵感在秤上会蒸发。"),
                    ("汤", "免费热汤一开放，全城的勺子都会来开会。"),
                    ("雨", "雨没有编制，热汤却要进预算，财政局会先感冒。"),
                    ("投票", "投票权一发放，弃权的人会比菜叶子还多。"),
                )
                host_side = opposite.get(side, "反方")
                cited_id = ""
                cite = "档案库这会儿没有更早的同题发言，本席只能现场抬杠。"
                if hits:
                    top = hits[0] or {}
                    cited_id = str(top.get("id") or "")
                    who = (top.get("metadata") or {}).get("player") or "某位旧辩手"
                    snippet = str(top.get("document") or "").replace("\n", " ")
                    if len(snippet) > 42:
                        snippet = snippet[:42] + "…"
                    cite = f"我翻到旧档案 {cited_id}：{who}说过「{snippet}」。"
                pivot = "你的论证把音量当成了证据，音量越大，漏洞越亮。"
                blob = f"{motion}{argument}"
                for key, line in pivots:
                    if key in blob:
                        pivot = line
                        break
                bangs = argument.count("！") + argument.count("!")
                score = 35 + (len(argument) % 40) + min(bangs, 4) * 6 + (8 if cited_id else 0)
                score = max(1, min(score, 99))
                rebuttal = (
                    f"主持人杠精站{host_side}。{player}，你以{side}主张「{motion}」。"
                    f"{cite}{pivot}"
                    f"所以本席不接受「{argument}」作为定论。"
                    f"离谱指数 {score}/99。下一句请给一个反例，不许只加感叹号。"
                )
                value = 2166136261
                for byte in f"{player}|{motion}|{argument}".encode("utf-8"):
                    value ^= byte
                    value = (value * 16777619) & 0xFFFFFFFF
                round_id = f"{value:08x}"
                save_body = json.dumps({
                    "player": player,
                    "motion": motion,
                    "side": side,
                    "argument": argument,
                    "rebuttal": rebuttal,
                    "score": score,
                    "cited_id": cited_id,
                    "round_id": round_id,
                    "host_side": host_side,
                }, ensure_ascii=False)
                return {
                    "rebuttal": rebuttal,
                    "score": score,
                    "cited_id": cited_id,
                    "host_side": host_side,
                    "round_id": round_id,
                    "save_body": save_body,
                }
          code_language: python3
          desc: "规则主持人根据检索到的旧档案抬杠。不调用大模型。"
          outputs:
            cited_id:
              type: string
            host_side:
              type: string
            rebuttal:
              type: string
            round_id:
              type: string
            save_body:
              type: string
            score:
              type: number
          selected: false
          title: 回应
          type: code
          variables:
            - value_selector:
                - "1733000101"
                - player
              variable: player
            - value_selector:
                - "1733000101"
                - motion
              variable: motion
            - value_selector:
                - "1733000101"
                - side
              variable: side
            - value_selector:
                - "1733000101"
                - argument
              variable: argument
            - value_selector:
                - "1733000102"
                - body
              variable: retrieve_body
        height: 160
        id: "1733000103"
        position:
          x: 680
          y: 220
        positionAbsolute:
          x: 680
          y: 220
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - key: ""
                type: text
                value: "{{#1733000103.save_body#}}"
            type: raw-text
          desc: "把玩家辩词和主持人回应写入 seekdb，服务端会 refresh_index。"
          headers: "Content-Type: application/json"
          method: post
          params: ""
          selected: false
          ssl_verify: true
          timeout:
            connect: 10
            read: 30
            write: 30
          title: HTTP 保存
          type: http-request
          url: "{{#env.DEBATE_API_BASE#}}/v1/save"
        height: 140
        id: "1733000104"
        position:
          x: 980
          y: 220
        positionAbsolute:
          x: 980
          y: 220
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: "把抬杠和保存结果交给玩家。"
          outputs:
            - value_selector:
                - "1733000103"
                - rebuttal
              value_type: string
              variable: rebuttal
            - value_selector:
                - "1733000103"
                - score
              value_type: number
              variable: score
            - value_selector:
                - "1733000103"
                - cited_id
              value_type: string
              variable: cited_id
            - value_selector:
                - "1733000104"
                - body
              value_type: string
              variable: saved
          selected: false
          title: 输出
          type: end
        height: 150
        id: "1733000105"
        position:
          x: 1280
          y: 220
        positionAbsolute:
          x: 1280
          y: 220
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.75