        title: 封存当票
        type: http-request
        url: http://host.docker.internal:8765/api/pawn/remember
        variables: []
      height: 134
      id: http_save
      position:
        x: 1330
        y: 282
      positionAbsolute:
        x: 1330
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef parse_body(http_body):\n    if isinstance(http_body, dict):\n        return http_body\n    if not isinstance(http_body, str) or not http_body.strip():\n        return {}\n    try:\n        parsed = json.loads(http_body)\n    except Exception:\n        return {}\n    return parsed if isinstance(parsed, dict) else {}\n\n\ndef main(http_body: str) -> dict:\n    data = parse_body(http_body)\n\n    if data.get(\"ok\") is False:\n        receipt = \"> 账本刚才被一阵风吹乱了，这一页暂时没有封存。请稍后再试。\"\n        saved = \"no\"\n        vault_count = 0\n    elif data.get(\"saved\"):\n        receipt = str(data.get(\"receipt\") or \"> 已封存。\")\n        saved = \"yes\"\n        try:\n            vault_count = int(data.get(\"vault_count\") or 0)\n        except Exception:\n            vault_count = 0\n    else:\n        receipt = str(data.get(\"receipt\") or \"> 本次只翻阅旧账，没有封存新当票。\")\n        saved = \"no\"\n        try:\n            vault_count = int(data.get(\"vault_count\") or 0)\n \
          \       except Exception:\n            vault_count = 0\n\n    return {\n        \"receipt\": receipt,\n        \"saved\": saved,\n        \"vault_count\": vault_count,\n    }\n"
        code_language: python3
        desc: 把封存回执变成一行读者能看到的账本状态。
        outputs:
          receipt:
            children: null
            type: string
          saved:
            children: null
            type: string
          vault_count:
            children: null
            type: number
        selected: false
        title: 解析回执
        type: code
        variables:
        - value_selector:
          - http_save
          - body
          value_type: string
          variable: http_body
      height: 134
      id: parse_save
      position:
        x: 1580
        y: 282
      positionAbsolute:
        x: 1580
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}


          ---

          {{#parse_save.receipt#}}{{#parse_context.ticket_line#}}'
        desc: 掌柜的当票 + 真实封存状态。
        selected: false
