        desc: 把玩家辩词和主持人回应写入 seekdb，服务端会 refresh_index。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        title: HTTP 保存
        type: http-request
        url: '{{#env.DEBATE_API_BASE#}}/v1/save'
      height: 140
      id: '1733000104'
      position:
        x: 1280
        y: 220
      positionAbsolute:
        x: 1280
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(saved_body: str, saved_status: float, retrieve_body: str,\
          \ round_id: str, rebuttal: str, score: float, cited_id: str) -> dict:\n\
          \    import json\n    if int(saved_status) != 200:\n        raise ValueError(\"\
          seekdb save HTTP request failed\")\n    saved = json.loads(saved_body)\n\
          \    expected = [\"p_\" + round_id, \"h_\" + round_id]\n    if saved.get(\"\
          refreshed\") is not True or saved.get(\"ids\") != expected:\n        raise\
          \ ValueError(\"seekdb write/refresh was not confirmed\")\n    retrieved\
          \ = json.loads(retrieve_body)\n    if retrieved.get(\"fusion\") != \"seekdb_hybrid_rrf\"\
          :\n        raise ValueError(\"seekdb hybrid retrieval was not used\")\n\
          \    return {\n        \"rebuttal\": rebuttal, \"score\": score, \"cited_id\"\
          : cited_id,\n        \"round_id\": round_id, \"saved\": json.dumps(saved,\
          \ ensure_ascii=False),\n        \"retrieved_ids\": json.dumps([hit[\"id\"\
          ] for hit in retrieved[\"hits\"]]),\n        \"fusion\": retrieved[\"fusion\"\
          ],\n    }\n"
        code_language: python3
        desc: 确认 seekdb 写入成功
        outputs:
          cited_id:
            type: string
          fusion:
            type: string
          rebuttal:
            type: string
          retrieved_ids:
            type: string
          round_id:
            type: string
          saved:
            type: string
          score:
            type: number
        title: 确认 seekdb 写入成功
        type: code
        variables:
        - value_selector:
          - '1733000104'
          - body
          variable: saved_body
        - value_selector:
          - '1733000104'
          - status_code
          variable: saved_status
        - value_selector:
          - '1733000102'
          - body
          variable: retrieve_body
        - value_selector:
          - '1733000103'
          - round_id
          variable: round_id
        - value_selector:
          - '1733000103'
          - rebuttal
          variable: rebuttal
        - value_selector:
          - '1733000103'
          - score
          variable: score
        - value_selector:
          - '1733000103'
          - cited_id
          variable: cited_id
      height: 140
      id: '1733000107'
      position:
        x: 1580
        y: 220
      positionAbsolute:
        x: 1580
        y: 220
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 把抬杠和保存结果交给玩家。
        outputs:
        - value_selector:
          - '1733000107'
          - rebuttal
          value_type: string
          variable: rebuttal
        - value_selector:
          - '1733000107'
          - score
          value_type: number
          variable: score
        - value_selector:
          - '1733000107'
          - cited_id
          value_type: string
          variable: cited_id
        - value_selector:
          - '1733000107'
          - round_id
          value_type: string
          variable: round_id
        - value_selector:
          - '1733000107'
          - saved
          value_type: string
          variable: saved
        - value_selector:
          - '1733000107'
          - retrieved_ids
          value_type: string
          variable: retrieved_ids
        - value_selector:
          - '1733000107'
          - fusion
          value_type: string
          variable: fusion
        selected: false
        title: 输出
        type: end
      height: 150
      id: '1733000105'
      position:
        x: 1880
        y: 220
      positionAbsolute:
        x: 1880
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.75
  rag_pipeline_variables: []
