          - argument
          variable: argument
        - value_selector:
          - '1733000102'
          - body
          variable: retrieve_body
        - value_selector:
          - '1733000102'
          - status_code
          variable: retrieve_status
      height: 160
      id: '1733000103'
      position:
        x: 980
        y: 220
      positionAbsolute:
        x: 980
        y: 220
      selected: false
