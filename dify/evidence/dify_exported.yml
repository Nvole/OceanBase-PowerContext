        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: ''
            type: text
            value: '{{#1733000106.request_body#}}'
          type: raw-text
        desc: 调用本机服务，让 seekdb hybrid_search 检索旧辩词。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        title: HTTP 检索
        type: http-request
        url: '{{#env.DEBATE_API_BASE#}}/v1/retrieve'
      height: 140
      id: '1733000102'
      position:
        x: 680
        y: 220
      positionAbsolute:
        x: 680
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(player: str, motion: str, side: str, argument: str, retrieve_body:\
          \ str, retrieve_status: float) -> dict:\n    import json\n    if int(retrieve_status)\
          \ != 200:\n        raise ValueError(\"seekdb retrieval HTTP request failed\"\
          )\n    if isinstance(retrieve_body, dict):\n        payload = retrieve_body\n\
          \    else:\n        payload = json.loads(retrieve_body or \"{}\")\n    hits\
          \ = payload.get(\"hits\") or []\n    opposite = {\"正方\": \"反方\", \"反方\"\
          : \"正方\"}\n    pivots = (\n        (\"猫\", \"猫如果交税，税务局得先学会听懂呼噜，否则征到的只是毛。\"\
          ),\n        (\"税\", \"税单一出，连路过的影子都会要求退税。\"),\n        (\"冰箱\", \"冰箱投出的票一定是冷藏票，热食提案永远过不了。\"\
          ),\n        (\"周一\", \"取消周一之后，周二会连夜改名，麻烦只是换了工牌。\"),\n        (\"梦想\", \"\
          梦想按斤卖会缺斤短两，因为灵感在秤上会蒸发。\"),\n        (\"汤\", \"免费热汤一开放，全城的勺子都会来开会。\"),\n\
          \        (\"雨\", \"雨没有编制，热汤却要进预算，财政局会先感冒。\"),\n        (\"投票\", \"投票权一发放，弃权的人会比菜叶子还多。\"\
          ),\n    )\n    host_side = opposite.get(side, \"反方\")\n    cited_id = \"\
          \"\n    cite = \"档案库这会儿没有更早的同题发言，本席只能现场抬杠。\"\n    if hits:\n        top\
          \ = hits[0] or {}\n        cited_id = str(top.get(\"id\") or \"\")\n   \
          \     who = (top.get(\"metadata\") or {}).get(\"player\") or \"某位旧辩手\"\n\
          \        snippet = str(top.get(\"document\") or \"\").replace(\"\\n\", \"\
          \ \")\n        if len(snippet) > 42:\n            snippet = snippet[:42]\
          \ + \"…\"\n        cite = f\"我翻到旧档案 {cited_id}：{who}说过「{snippet}」。\"\n \
          \   pivot = \"你的论证把音量当成了证据，音量越大，漏洞越亮。\"\n    blob = f\"{motion}{argument}\"\
          \n    for key, line in pivots:\n        if key in blob:\n            pivot\
          \ = line\n            break\n    bangs = argument.count(\"！\") + argument.count(\"\
          !\")\n    score = 35 + (len(argument) % 40) + min(bangs, 4) * 6 + (8 if\
          \ cited_id else 0)\n    score = max(1, min(score, 99))\n    rebuttal = (\n\
          \        f\"主持人杠精站{host_side}。{player}，你以{side}主张「{motion}」。\"\n       \
          \ f\"{cite}{pivot}\"\n        f\"所以本席不接受「{argument}」作为定论。\"\n        f\"\
          离谱指数 {score}/99。下一句请给一个反例，不许只加感叹号。\"\n    )\n    value = 2166136261\n  \
          \  for byte in f\"{player}|{motion}|{argument}\".encode(\"utf-8\"):\n  \
          \      value ^= byte\n        value = (value * 16777619) & 0xFFFFFFFF\n\
          \    round_id = f\"{value:08x}\"\n    save_body = json.dumps({\n       \
          \ \"player\": player,\n        \"motion\": motion,\n        \"side\": side,\n\
          \        \"argument\": argument,\n        \"rebuttal\": rebuttal,\n    \
          \    \"score\": score,\n        \"cited_id\": cited_id,\n        \"round_id\"\
          : round_id,\n        \"host_side\": host_side,\n    }, ensure_ascii=False)\n\
          \    return {\n        \"rebuttal\": rebuttal,\n        \"score\": score,\n\
          \        \"cited_id\": cited_id,\n        \"host_side\": host_side,\n  \
          \      \"round_id\": round_id,\n        \"save_body\": save_body,\n    }\n"
        code_language: python3
        desc: 规则主持人根据检索到的旧档案抬杠。不调用大模型。
        outputs:
          cited_id:
            type: string
          host_side:
            type: string
          rebuttal:
            type: string
          round_id:
            type: string
          save_body:
            type: string
          score:
            type: number
        selected: false
        title: 回应
        type: code
        variables:
        - value_selector:
          - '1733000101'
          - player
          variable: player
        - value_selector:
          - '1733000101'
          - motion
          variable: motion
        - value_selector:
          - '1733000101'
          - side
          variable: side
        - value_selector:
