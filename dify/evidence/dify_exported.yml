    - data:
        code: "def main(argument: str, motion: str) -> dict:\n    import json\n  \
          \  return {\"request_body\": json.dumps({\"text\": argument, \"motion\"\
          : motion, \"n_results\": 8}, ensure_ascii=False)}\n"
        code_language: python3
        desc: 安全序列化输入
        outputs:
